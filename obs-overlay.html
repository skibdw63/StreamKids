<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StreamKids OBS Overlay</title>
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    body {
      margin: 0;
      background: transparent !important;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    .overlay-box {
      background: rgba(18, 18, 18, 0.9);
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 16px 24px;
      display: inline-block;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
      margin: 20px;
    }
    /* Soccer Scoreboard Style */
    .soccer-container { text-align: center; }
    .match-title { font-size: 1rem; color: #00ffcc; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .score-board { display: flex; align-items: center; gap: 16px; font-size: 1.8rem; font-weight: bold; }
    .team { color: #fff; }
    .score { background: #000; padding: 4px 12px; border-radius: 8px; color: #00ffcc; border: 1px solid #333; }

    /* Timer Style */
    .timer-container { text-align: center; }
    .timer-title { font-size: 0.9rem; color: #ffaa00; margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
    .timer-clock { font-size: 2.2rem; font-weight: bold; font-family: monospace; color: #fff; }

    /* Custom Text Style */
    .text-container { font-size: 1.4rem; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
  </style>
</head>
<body>

  <div id="widget-view" class="overlay-box">
    <p style="margin: 0; color: #888;">Connecting to live stream data...</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const fallbackWidget = urlParams.get('widget') || 'soccer';
    const streamerUid = urlParams.get('uid'); 

    function startOverlayListener() {
      const container = document.getElementById('widget-view');

      if (!streamerUid) {
        container.innerHTML = `<span style="color: #ff5555;">Error: Missing ?uid= in OBS URL!</span>`;
        return;
      }

      if (typeof firebase === 'undefined' || !firebase.apps.length) {
        container.innerHTML = `<span style="color: #ff5555;">Error: Firebase non-initialized! Check firebase-config.js</span>`;
        return;
      }

      const db = firebase.firestore();

      db.collection('obsOverlays').doc(streamerUid).onSnapshot((doc) => {
        if (!doc.exists) {
          container.innerHTML = `<span style="color: #ffaa00;">Waiting for data... Click "Save & Publish" in App!</span>`;
          return;
        }

        const data = doc.data();
        const activeType = data.widgetType || data.type || fallbackWidget;

        if (activeType === 'soccer') {
          container.innerHTML = `
            <div class="soccer-container">
              <div class="match-title">${data.matchTitle || 'Match Finals'}</div>
              <div class="score-board">
                <span class="team">${data.teamA || 'Home'}</span>
                <span class="score">${data.scoreA !== undefined ? data.scoreA : 0}</span>
                <span style="color: #666;">-</span>
                <span class="score">${data.scoreB !== undefined ? data.scoreB : 0}</span>
                <span class="team">${data.teamB || 'Away'}</span>
              </div>
            </div>
          `;
        } else if (activeType === 'timer') {
          container.innerHTML = `
            <div class="timer-container">
              <div class="timer-title">${data.timerTitle || 'Starting Soon'}</div>
              <div class="timer-clock">${data.timerVal || '05:00'}</div>
            </div>
          `;
        } else if (activeType === 'text') {
          container.innerHTML = `
            <div class="text-container">
              ${data.customText || 'Welcome to the Stream!'}
            </div>
          `;
        }
      }, (err) => {
        console.error("Firestore Listen Error:", err);
        container.innerHTML = `<span style="color: #ff4444;">Permission / Database Error: ${err.message}</span>`;
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Small timeout to allow firebase-config.js to load completely
      setTimeout(startOverlayListener, 500);
    });
  </script>
</body>
</html>
