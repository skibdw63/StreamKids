<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamKids</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <!-- PeerJS WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Custom Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/stream.js"></script>
  <script src="js/video.js"></script>

  <script>
    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
      const target = document.getElementById(tabId);
      if (target) target.style.display = 'block';

      if (tabId === 'fyp-tab') {
        loadFYP();
      }
    }
  </script>
</head>
<body style="background: #0d0d0d; color: #fff; font-family: sans-serif; margin: 20px;">

  <h1>StreamKids</h1>

  <!-- Navigation Bar -->
  <nav style="display: flex; gap: 10px; margin-bottom: 20px;">
    <button onclick="showTab('feed')">Live Feed</button>
    <button onclick="showTab('go-live')">Go Live</button>
    <button onclick="showTab('upload-tab')">Upload Video</button>
    <button onclick="showTab('fyp-tab')">For You</button>
    <button onclick="showTab('schedule')">Schedule</button>
  </nav>

  <!-- Live Feed Section -->
  <div id="feed" class="tab-content">
    <h2>Watch Stream</h2>
    <input type="text" id="search-stream-input" placeholder="Enter Stream Title...">
    <button onclick="searchAndWatchStream()">Watch Stream</button>

    <div style="margin-top: 15px;">
      <p>Live Viewers: <span id="viewer-count" style="color: #00ffcc; font-weight: bold;">0</span></p>
      <video id="remote-webcam" autoplay playsinline controls style="width: 100%; max-width: 600px; background: #000; border-radius: 8px;"></video>
    </div>

    <!-- Chat -->
    <div style="margin-top: 20px; max-width: 600px;">
      <h3>Live Chat</h3>
      <div id="chat-messages" style="height: 150px; background: #1a1a1a; overflow-y: auto; padding: 10px; border-radius: 6px; border: 1px solid #333;"></div>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="text" id="chat-input" placeholder="Type a message..." style="flex: 1; padding: 8px;">
        <button onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Go Live Section -->
  <div id="go-live" class="tab-content" style="display: none;">
    <h2>Start Your Stream</h2>
    <input type="text" id="stream-title-input" placeholder="Stream Title">
    <br><br>
    <label for="mic-select">Microphone: </label>
    <select id="mic-select"></select>
    <br><br>
    <button onclick="startMyStream()">Start Broadcast</button>
    <button onclick="stopMyStream()" style="background: red; color: white;">Stop Broadcast</button>
    <p id="my-peer-id" style="color: #aaa;"></p>

    <div style="margin-top: 15px;">
      <video id="my-webcam" autoplay playsinline muted style="width: 100%; max-width: 600px; background: #000; border-radius: 8px;"></video>
    </div>
  </div>

  <!-- Upload Video Section -->
  <div id="upload-tab" class="tab-content" style="display: none;">
    <h2>Upload MP4 Video</h2>
    
    <div id="drop-zone" style="border: 2px dashed #444; padding: 30px; text-align: center; margin-bottom: 15px; border-radius: 8px; cursor: pointer;">
      <p style="margin-bottom: 10px;">Drag & Drop your MP4 video here, or click below</p>
      <input type="file" id="video-file-input" accept="video/mp4" style="display: none;" onchange="handleFileSelect(event)">
      <button onclick="document.getElementById('video-file-input').click()">Select File</button>
    </div>

    <div id="upload-form" style="display: none; background: #181818; padding: 15px; border-radius: 8px; max-width: 500px;">
      <p id="selected-file-name" style="color: #00ffcc; font-weight: bold;"></p>
      
      <input type="text" id="video-title-input" placeholder="Video Title" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;"><br>
      
      <textarea id="video-desc-input" placeholder="Description..." style="width: 100%; height: 80px; padding: 8px; margin-bottom: 10px; box-sizing: border-box;"></textarea><br>

      <div style="margin-bottom: 15px;">
        <label style="margin-right: 15px;">
          <input type="radio" name="video-visibility" value="public" checked> Public
        </label>
        <label>
          <input type="radio" name="video-visibility" value="private"> Private
        </label>
      </div>

      <button id="upload-btn" onclick="uploadVideo()">Publish Video</button>
      <p id="upload-status" style="color: #aaa; margin-top: 10px;"></p>
    </div>
  </div>

  <!-- For You Page Section -->
  <div id="fyp-tab" class="tab-content" style="display: none;">
    <h2>For You Feed</h2>
    <div id="fyp-container" style="display: flex; flex-direction: column; gap: 20px; max-width: 600px;">
      <!-- Feed populates here automatically -->
    </div>
  </div>

  <!-- Schedule Section -->
  <div id="schedule" class="tab-content" style="display: none;">
    <h2>Schedule a Stream</h2>
    <input type="text" id="sched-title" placeholder="Upcoming Title"><br><br>
    <input type="datetime-local" id="sched-time"><br><br>
    <button onclick="scheduleStream()">Save Schedule</button>

    <h3>Upcoming Streams</h3>
    <div id="upcoming-streams-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
  </div>

</body>
</html>
