<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamKids</title>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase & PeerJS Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Top Navbar -->
  <div class="navbar">
    <div class="logo">🔴 StreamKids</div>
    <div>
      <button class="btn btn-red" onclick="startMyStream()">+ Go Live</button>
      <button class="btn btn-blue" onclick="openSignup()">Parent Sign Up</button>
    </div>
  </div>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="menu-item active" onclick="showTab('feed')">🏠 Live Streams</div>
      <div class="menu-item" onclick="showTab('dashboard')">📊 Dashboard</div>
      <div class="menu-item" onclick="showTab('gate')">🌐 Country / Gate</div>
    </div>

    <div class="main-content">
      <!-- Gate Tab -->
      <div id="section-gate">
        <div class="modal">
          <h2>Select Country</h2>
          <button class="btn btn-blue" onclick="selectCountry('USA')">USA 🇺🇸</button>
          <button class="btn btn-green" onclick="selectCountry('Mexico')">Mexico 🇲🇽</button>
          <button class="btn btn-red" onclick="selectCountry('Canada')">Canada 🇨🇦</button>
        </div>

        <div id="math-gate" class="modal" style="display: none;">
          <h2>Parent Math Verification</h2>
          <p id="math-question">Loading...</p>
          <input type="number" id="math-answer" placeholder="Answer">
          <br>
          <button class="btn btn-green" onclick="checkMath()">Verify Parent</button>
        </div>
      </div>

      <!-- Feed Tab -->
      <div id="section-feed" style="display: none;">
        <h2>Active Live Broadcasts</h2>
        <div class="grid" id="stream-grid">
          <div class="video-card">
            <video id="my-webcam" autoplay playsinline muted></video>
            <div style="margin-top: 8px; font-weight: bold;">Your Live Stream Feed</div>
            <div id="my-peer-id" style="font-size: 12px; color: #aaa;">Peer ID: Off</div>
          </div>
          <div class="video-card">
            <video id="remote-webcam" autoplay playsinline></video>
            <div style="margin-top: 8px; font-weight: bold;">Watched Remote Stream</div>
            <input type="text" id="remote-peer-input" placeholder="Enter Streamer Peer ID" style="width: 70%;">
            <button class="btn btn-blue" onclick="connectToStreamer()">Watch</button>
          </div>
        </div>
      </div>

      <!-- Dashboard Tab -->
      <div id="section-dashboard" style="display: none;">
        <h2>Creator Dashboard</h2>
        <div class="grid">
          <div class="video-card"><h3>Views</h3><p style="font-size: 24px; color: #4caf50;">0</p></div>
          <div class="video-card"><h3>Parent Status</h3><p id="stat-status" style="font-size: 18px; color: #ff9800;">Pending Verification</p></div>
        </div>
      </div>

      <!-- Sign Up Modal -->
      <div id="signup-modal" class="modal" style="display: none;">
        <h2>Parent & Creator Registration</h2>
        <input type="email" id="parent-email" placeholder="Parent Email">
        <input type="password" id="parent-pass" placeholder="Password">
        <br>
        <button class="btn btn-blue" onclick="registerUser()">Register Account</button>
        <button class="btn" style="background: #444;" onclick="closeSignup()">Close</button>
      </div>
    </div>
  </div>

  <!-- Custom External JavaScript Files -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stream.js"></script>
</body>
</html>
