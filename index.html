<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamKids</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <!-- PeerJS WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Custom Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/stream.js"></script>
  <script src="js/video.js"></script>

  <script>
    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
      const target = document.getElementById(tabId);
      if (target) target.style.display = 'block';

      if (tabId === 'fyp-tab') {
        loadFYP();
      }
    }
  </script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="main-nav">
    <button onclick="showTab('feed')" class="nav-btn active">Live Feed</button>
    <button onclick="showTab('upload-tab')" class="nav-btn">Upload Video</button>
    <button onclick="showTab('fyp-tab')" class="nav-btn">For You</button>
    <button onclick="showTab('schedule')" class="nav-btn">Schedule</button>
  </nav>

  <!-- Main Live Dashboard (Old StreamKids Layout) -->
  <div id="feed" class="tab-content">
    <div class="card-panel">
      <h2>Live Stream Feed</h2>
      <div class="controls-bar">
        <input type="text" id="stream-title-input" placeholder="Stream Title..." class="dark-input">
        <button onclick="startMyStream()" class="btn btn-green">+ Go Live</button>
        <button onclick="stopMyStream()" class="btn btn-red">Stop Stream</button>

        <span class="divider">|</span>

        <input type="text" id="search-stream-input" placeholder="Search Stream..." class="dark-input">
        <button onclick="searchAndWatchStream()" class="btn btn-blue">Watch Stream</button>

        <label for="mic-select" class="mic-label">Microphone:</label>
      </div>

      <div class="mic-row">
        <select id="mic-select" class="dark-input mic-select"></select>
      </div>
    </div>

    <div class="viewer-count-bar">
      <span>👁️ Live Viewers: <strong id="viewer-count" class="green-text">0</strong></span>
    </div>

    <!-- Two-Column Layout (Cameras Left, Chat Right) -->
    <div class="dashboard-grid">
      <!-- Left Column: Video Feeds -->
      <div class="video-column">
        <div class="video-card">
          <h3>Your Camera (Streamer)</h3>
          <p id="my-peer-id" class="peer-id-text">Peer ID: Not Connected</p>
          <video id="my-webcam" autoplay playsinline muted class="stream-video"></video>
        </div>

        <div class="video-card">
          <h3>Watching Stream</h3>
          <video id="remote-webcam" autoplay playsinline controls class="stream-video"></video>
        </div>
      </div>

      <!-- Right Column: Live Chat -->
      <div class="chat-column">
        <div class="chat-card">
          <h3>Live Chat</h3>
          <div id="chat-messages" class="chat-box"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Type a message..." class="dark-input flex-input">
            <button onclick="sendChatMessage()" class="btn btn-gray">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload Video Section -->
  <div id="upload-tab" class="tab-content" style="display: none;">
    <div class="card-panel">
      <h2>Upload MP4 Video</h2>
      <div id="drop-zone" class="drop-zone-box">
        <p>Drag & Drop your MP4 video here, or click below</p>
        <input type="file" id="video-file-input" accept="video/mp4" style="display: none;" onchange="handleFileSelect(event)">
        <button onclick="document.getElementById('video-file-input').click()" class="btn btn-blue" style="margin-top: 10px;">Select File</button>
      </div>

      <div id="upload-form" style="display: none;" class="upload-form-box">
        <p id="selected-file-name" class="green-text" style="margin-bottom: 10px;"></p>
        <input type="text" id="video-title-input" placeholder="Video Title" class="dark-input full-width"><br><br>
        <textarea id="video-desc-input" placeholder="Description..." class="dark-input full-width" style="height: 80px;"></textarea><br><br>

        <div style="margin-bottom: 15px;">
          <label style="margin-right: 15px;"><input type="radio" name="video-visibility" value="public" checked> Public</label>
          <label><input type="radio" name="video-visibility" value="private"> Private</label>
        </div>

        <button id="upload-btn" onclick="uploadVideo()" class="btn btn-green">Publish Video</button>
        <p id="upload-status" style="color: #aaa; margin-top: 10px;"></p>
      </div>
    </div>
  </div>

  <!-- For You Page Section -->
  <div id="fyp-tab" class="tab-content" style="display: none;">
    <div class="card-panel">
      <h2>For You Feed</h2>
      <div id="fyp-container" class="fyp-feed"></div>
    </div>
  </div>

  <!-- Schedule Section -->
  <div id="schedule" class="tab-content" style="display: none;">
    <div class="card-panel">
      <h2>Schedule a Stream</h2>
      <input type="text" id="sched-title" placeholder="Upcoming Title" class="dark-input"><br><br>
      <input type="datetime-local" id="sched-time" class="dark-input"><br><br>
      <button onclick="scheduleStream()" class="btn btn-blue">Save Schedule</button>

      <h3 style="margin-top: 25px;">Upcoming Streams</h3>
      <div id="upcoming-streams-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;"></div>
    </div>
  </div>

</body>
</html>
