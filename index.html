<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamKids - Live Streaming</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">StreamKids</div>
    <div class="nav-buttons">
      <button onclick="showTab('feed')">Home</button>
      <button onclick="showTab('auth')" id="nav-auth-btn">Parent Login / Sign Up</button>
      <button onclick="startMyStream()" class="go-live-btn">+ Go Live</button>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="container">

    <!-- TAB 1: Stream Feed & Viewer -->
    <section id="feed-tab" class="tab-content active">
      <h2>Live Stream Feed</h2>
      
      <div class="stream-controls">
        <input type="text" id="remote-peer-input" placeholder="Enter Streamer's Peer ID">
        <button onclick="connectToStreamer()">Watch Stream</button>
      </div>

      <div class="video-grid">
        <div class="video-card">
          <h3>Your Camera (Streamer)</h3>
          <p id="my-peer-id">Peer ID: Connecting...</p>
          <video id="my-webcam" autoplay playsinline muted></video>
        </div>

        <div class="video-card">
          <h3>Watching Stream</h3>
          <video id="remote-webcam" autoplay playsinline></video>
        </div>
      </div>
    </section>

    <!-- TAB 2: Authentication & Parent Math Verification -->
    <section id="auth-tab" class="tab-content">
      <div class="auth-box">
        <h2>Parent Verification Gate</h2>
        <p>COPPA Compliance Test: Solve the equation to proceed.</p>

        <!-- Parent Math Gate -->
        <div id="math-gate">
          <p id="math-question" class="math-problem"></p>
          <input type="number" id="math-answer" placeholder="Your Answer">
          <button onclick="verifyParentMath()">Verify Math Gate</button>
        </div>

        <!-- Hidden Auth Form unlocked by Math Gate -->
        <div id="firebase-auth-form" class="hidden">
          <h3>Parent Account Registration</h3>
          <input type="email" id="auth-email" placeholder="Parent Email">
          <input type="password" id="auth-password" placeholder="Password">
          
          <div class="auth-actions">
            <button onclick="handleSignUp()">Parent Sign Up</button>
            <button onclick="handleLogin()">Parent Log In</button>
          </div>
          <p id="auth-status" class="status-msg"></p>
        </div>
      </div>
    </section>

  </main>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stream.js"></script>
  <script>
    // Tab Switching Logic
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      if (tabName === 'feed') document.getElementById('feed-tab').classList.add('active');
      if (tabName === 'auth') document.getElementById('auth-tab').classList.add('active');
    }
  </script>
</body>
</html>
